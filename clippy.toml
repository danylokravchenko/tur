# Thresholds for the lints enabled in Cargo.toml `[workspace.lints]`; defaults are omitted.

# Breaking changes are allowed, so lints also apply to public items.
avoid-breaking-exported-api = false

# Modular structure: split functions past these limits.
too-many-lines-threshold = 150
cognitive-complexity-threshold = 20

struct-field-name-threshold = 20

disallowed-types = [
    { path = "std::sync::Mutex", reason = "use parking_lot::Mutex: no poisoning, no unwrap" },
    { path = "std::sync::RwLock", reason = "use parking_lot::RwLock: no poisoning, no unwrap" },
]
