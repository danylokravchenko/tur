[workspace]
members = [
    "crates/tur-core",
    "crates/tur-metal",
    "crates/tur-models",
    "crates/tur-engine",
    "crates/tur",
    "crates/tur-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "A strong inference engine"
repository = "https://github.com/danylokravchenko/tur"
authors = ["danylo.kravchenko.r@gmail.com"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

candle-core = "0.11.0"
candle-nn = "0.11.0"
tokenizers = "0.21"
llguidance = { version = "1.7.5", default-features = false, features = ["lark"] }
toktrie_hf_tokenizers = "1.7.5"

serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
toml = "0.9.12"
minijinja = { version = "2.19.0", features = ["builtins", "json", "preserve_order"] }
thiserror = "2.0.18"
parking_lot = "0.12.5"
uuid = { version = "1.23.1", features = ["v4"] }
metal = { version = "0.33.0", features = ["mps"] }
hf-hub = "0.5.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
axum = { version = "0.8.9", features = ["json", "macros"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
async-stream = "0.3.6"

tikv-jemallocator = "0.6.1"

safetensors = "0.8.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
candle-metal-kernels = "=0.11.0"
objc2-metal = "=0.3.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "allow"                 # 390+ public items lack docs; enable per crate as they are written
unreachable_pub = "warn"               # visibility states the real boundary: `pub` only if exported
unused_qualifications = "warn"
trivial_numeric_casts = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Groups first; individual lints below override them.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"      # transitive duplicates are outside our control

# No panics: every failure is a `TurError`.
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
unreachable = "deny"
todo = "deny"
exit = "deny"
string_slice = "deny"                  # panics off a UTF-8 boundary

# No silently discarded results or suppressions without a reason.
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
try_err = "warn"

# Concurrency: locks are parking_lot (clippy.toml), never held across await.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
mutex_atomic = "warn"
mutex_integer = "warn"
rc_mutex = "warn"
mem_forget = "deny"

# Modular structure: small functions, one module-file style, encapsulated structs.
too_many_lines = "warn"                # threshold in clippy.toml
cognitive_complexity = "warn"          # threshold in clippy.toml
self_named_module_files = "warn"       # a module with children lives in `name/mod.rs`
partial_pub_fields = "warn"            # a struct is plain data (all pub) or encapsulated (none)
same_name_method = "warn"
module_name_repetitions = "allow"

# Memory and numerics.
clone_on_ref_ptr = "warn"              # make `Arc` clones explicit with `Arc::clone`
redundant_clone = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
large_include_file = "warn"
rc_buffer = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
suboptimal_flops = "warn"
imprecise_flops = "warn"
fn_to_numeric_cast_any = "warn"

# Code quality.
dbg_macro = "deny"
print_stdout = "warn"                  # binaries and benches opt in with a reason
print_stderr = "warn"
string_add = "warn"
format_push_string = "warn"
verbose_file_reads = "warn"
infinite_loop = "warn"
rest_pat_in_fully_bound_structs = "warn"
empty_structs_with_brackets = "warn"
redundant_type_annotations = "warn"
use_self = "warn"
option_if_let_else = "warn"

# Pedantic lints that cost more than they catch here.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"           # nothing panics
cast_possible_truncation = "allow"     # shape arithmetic is validated before casts
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"

# Host reference math (Candle CPU ops, kernel references, the sampler, quantization)
# dominates test time unoptimized: the suite takes ~22 s instead of ~140 s.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.tur-metal]
opt-level = 2

[profile.dev.package.tur-models]
opt-level = 2

[profile.pre-release]
inherits = "release"
lto = false
codegen-units = 256

[profile.release]
lto = "fat" #  LLVM's link time optimizations
codegen-units = 1
panic = "abort"
